<div class="header action-button-container">
  <h2>Create Azure DevOps Work Item</h2>
  <sigrid-icon-button iconClass="codicon codicon-close" (onClick)="close()" />
</div>
<form [formGroup]="workItemForm">
  <div class="form-row">
    <label for="azure-devops-title">Title</label>
    <input id="azure-devops-title" type="text" formControlName="title" placeholder="Enter work item title" />
  </div>
  <div class="form-row">
    <label for="azure-devops-work-item-type">Work item type</label>
    @if (loading()) {
      <span class="work-item-type-status">Loading work item types...</span>
    } @else if (error()) {
      <span class="work-item-type-status error">{{ error() }}</span>
    } @else {
      <select id="azure-devops-work-item-type" formControlName="workItemType">
        @for (type of types(); track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    }
  </div>
  <div class="form-row">
    <span class="selected-count">{{ selectedCount() }} finding(s) selected</span>
  </div>
  <div class="form-submit-row">
    <button class="primary" type="submit" (click)="onSubmit()" [disabled]="!workItemForm.valid">Create Work Item</button>
  </div>
</form>
